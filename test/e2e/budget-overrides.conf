# 插件级 e2e 耗时预算例外（默认 300s/插件，见 docs/e2e-performance.md §1）
#
# 格式：`extensions/<名>` 或 `skills/<名>` = 秒数；`#` 起注释。
# ⚠️ 例外只用于「确有真实工作量、无法靠精简等待达标」的插件，并必须写明理由。
#    能用「缩短等待/合并用例」解决的，不许加例外。
#
# org：24 条 smoke（真实多进程编排：派发/认领/交付/验收/抢占/自愈，含跨 20s 自然完成点的
#      必要等待）+ 6 条 TUI 用例（每条各起一次真实 pi，启动 ~40-70s）。
#      CI 实测：全量串行 **1177s**（2026-10-28，2 核 ubuntu、池化 4）；本地独立跑 ~512s。
#      现拆成两个专用 job：`e2e-org` 只跑 smoke、`e2e-org-tui` 只跑 TUI，**两者都阻塞**，
#      各自耗时远低于 1200s；该预算是「确有真实工作量、且合并用例需单独改造」的宽容阈值。
#      注意 kill 上限 ≠ 预算：`run-e2e.sh` 的 `worker_limit_for` 只在**检测到机器争用**时放宽到
#      max(budget×2, 600s)（org → 2400s），独占时 kill 上限就等于预算本身（1200s）。
#      即抬高预算会同时抬高挂死上限，兜底靠 job 级 `timeout-minutes`（30min）。
extensions/org=1200
