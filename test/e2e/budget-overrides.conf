# 插件级 e2e 耗时预算例外（默认 300s/插件，见 docs/e2e-performance.md §1）
#
# 格式：`extensions/<名>` 或 `skills/<名>` = 秒数；`#` 起注释。
# ⚠️ 例外只用于「确有真实工作量、无法靠精简等待达标」的插件，并必须写明理由。
#    能用「缩短等待/合并用例」解决的，不许加例外。
#
# org：25 个 smoke + 8 个 TUI 用例全部要起**真实 tmux 成员 + 真实 pi 进程**
#      （多进程编排链路：派发/认领/交付/验收/抢占/自愈），且含跨 20s 自然完成点的
#      必要等待（验证"中断真的停住"）。实测串行 514s、池化 ~536s，是真实工作量而非白等。
extensions/org=900   # 25 smoke + 8 TUI 全要起真实 tmux 成员 + 真实 pi 进程；实测：独立跑 512s、全量池化 737s（模块内 smoke+TUI 串行叠加，池化下再受同机负载抬升）
