# 插件级 e2e 耗时预算例外（默认 300s/插件，见 docs/e2e-performance.md §1）
#
# 格式：`extensions/<名>` 或 `skills/<名>` = 秒数；`#` 起注释。
# ⚠️ 例外只用于「确有真实工作量、无法靠精简等待达标」的插件，并必须写明理由。
#    能用「缩短等待/合并用例」解决的，不许加例外。
#
# org：25 个 smoke + 8 个 TUI 用例全部要起**真实 tmux 成员 + 真实 pi 进程**
#      （多进程编排链路：派发/认领/交付/验收/抢占/自愈），且含跨 20s 自然完成点的
#      必要等待（验证"中断真的停住"）。实测串行 514s、池化 ~536s，是真实工作量而非白等。
# org：CI 实测 **1177s**（2026-10-28，2 核 ubuntu + 池化 4），本地独立跑 ~512s、本地池化 737s。
# 抬到 1500s 的理由：8 条 TUI 用例每条都要起真实 pi（启动 ~40-70s，CI 上还要下载 fd/rg），
# 25 条 smoke 要做真实多进程编排，属「确有真实工作量」；把 8 条 TUI 合并成 1 条 pi 会话
# 属结构性精简，需要单独改造，不在本次范围。注意 kill 上限是 max(budget×2,600)=3000s，
# 所以抬高预算只影响「报告阈值」，不会掩盖挂死（挂死仍会被 3000s 上限杀掉）。
extensions/org=1500
