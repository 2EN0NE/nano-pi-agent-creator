name: CI

on:
    push:
        branches: [main, master, dev]
    pull_request:
        branches: [main, master, dev]

env:
    # 统一 node 版本
    NODE_VERSION: '22'
    CI: true

# ── 通用步骤宏 ──
# 由于 GitHub Actions 不支持 YAML 锚点在 steps 中使用，
# 下面通过 setup-node + 公共依赖安装步骤在各 job 中展开

jobs:
    # ── Formatting ──
    format:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check formatting
              run: npm run format:check

    # ── Type checking ──
    typecheck:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: TypeScript check
              run: npm run typecheck
            - name: TypeScript check (smart-context)
              run: |
                  cd extensions/context/smart-context
                  npx tsc --noEmit

    # ── ci-watch 独立类型检查（根 tsconfig exclude 该扩展，需独立 job）──
    # ci-watch 是带自己 tsconfig 的独立包；此前其类型错误只能在 e2e 的 dist
    # 构建时（间接、分钟级）暴露，这里提供秒级快速门禁。
    ci-watch-typecheck:
        name: ci-watch TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: ci-watch type check
              run: cd extensions/verification/ci-watch && npx tsc --noEmit

    # ── Linting ──
    lint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: ESLint check
              run: npm run lint

    # ── TUI 合规门禁（ADR-0023，阻塞）──
    tui-compliance:
        name: TUI Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check TUI compliance (blocking)
              run: npm run lint:tui

    # ── Config 合规门禁（pi-config 标准化，WARN 不阻塞）──
    # ── Config 合规门禁 ──
    # 规则 1/2（手写路径 / raw JSON）尚有历史欠账 → WARN 不阻塞；
    # 规则 3（仓库级配置的解析锚点，AGENTS.md【强制判断】）无历史欠账 → **阻塞**。
    config-compliance:
        name: Config Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check config anchor rule (blocking)
              run: npm run lint:config:anchor
            - name: Check config compliance (warning, non-blocking)
              run: npm run lint:config

    # ── SAST ──
    semgrep:
        name: Semgrep
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep:latest
        steps:
            - uses: actions/checkout@v4
            - name: Semgrep ERROR (blocks merge)
              run: |
                  semgrep --config .semgrep.yml \
                    --exclude 'node_modules/**' \
                    --exclude '.pi/**' \
                    --exclude '.git/**' \
                    --metrics=off \
                    --no-git-ignore \
                    --error \
                    --severity ERROR
            - name: Semgrep WARNING (report only)
              if: always()
              run: |
                  semgrep --config .semgrep.yml \
                    --exclude 'node_modules/**' \
                    --exclude '.pi/**' \
                    --exclude '.git/**' \
                    --metrics=off \
                    --no-git-ignore \
                    --severity WARNING

    # ── Unit Tests（Vitest，阻塞）──
    unit-tests:
        name: Vitest
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run Vitest tests
              run: npm test

    # ── Bench Unit（analyze.py 统计口径，阻塞）──
    bench-unit:
        name: Bench Analyze Unit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Run bench python unit tests
              run: |
                  for t in bench/test_*.py; do
                    echo "== $t =="
                    python3 "$t" || exit 1
                  done

    # ── Bench Smoke（verify.sh 失败侧判定 + 骨架，阻塞，mock-llm 不烧钱）──
    bench-smoke:
        name: Bench Smoke
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25.2'
            - run: npm ci
            - name: Setup CI environment (installs pi)
              run: bash scripts/setup-ci.sh
            - name: Run bench smoke (scc, mock-llm)
              run: bash bench/smoke-test.sh --task scc-bounded-memory-spilling

    # ── E2E Tests（bash 集成测试，阻塞）──
    # 全量 e2e 模块多、耗时长（单 job 曾超 70 分钟并触发 runner 异常），
    # 拆成并行 shard 降低单 job 资源压力。shard 按模块名确定性 hash 分桶（run-e2e.sh
    # 的 `_shard_match`），**不做硬编码模块清单**——新增模块一定落在某个 shard 上。
    # 唯一允许「不在矩阵里跑」的是下面显式 `--exclude` 的模块（各有专用 job）。
    # E2E_BUDGET_STRICT=1：CI 是独占机，耗时超预算一律判失败，不降级为 WARN。
    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3, 4, 5, 6, 7]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run bash e2e tests (shard ${{ matrix.shard }})
              env:
                  # 2 核 runner 上池化 4 会把「起真实 pi + 真实 tmux」的 TUI 用例拖到超时
                  # （org / ci-watch / custom-rename 在不同 run 里轮流红）。降到 2：单用例
                  # 恢复自然耗时，总墙钟增加但仍远低于 40min job 上限（实测 shard 1 ~16min）。
                  E2E_POOL_SIZE: 2
                  E2E_BUDGET_STRICT: '1'
                  # CI 无并发交互 pi 会话 → 环境哨兵可以硬阻塞：真实 $HOME/.pi 被改动
                  # 一律判失败（护栏见 ADR-0045 D6 修订：pi 配置根 guard + 内容哈希口径）
                  E2E_ENV_SENTINEL: 'strict'
              run: |
                  # 显式排除（其余模块由 hash 分桶覆盖，不写清单）：
                  #   worktree       → e2e-worktree job（vitest + bash e2e + TUI）
                  #   permission-gate → e2e-permission-gate-smoke job（其 TUI 用例在
                  #                     CI Linux 崩溃，TODO P0；smoke 走专用 job）
                  bash test/e2e/scripts/run-e2e.sh \
                    --shard "${{ matrix.shard }}/8" \
                    --exclude worktree,permission-gate,org
            - name: Warn on skipped permission-gate TUI (TODO P0)
              if: matrix.shard == 4
              run: |
                  echo "::warning::permission-gate TUI skipped in CI (TODO P0)"
                  echo "  → smoke covered by permission-gate-smoke job"
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results-${{ matrix.shard }}
                  path: test/results/
            - name: Show summary
              if: always()
              run: |
                  LATEST=$(ls -1t test/results/ 2>/dev/null | head -1)
                  if [[ -n "$LATEST" ]]; then
                    SF="test/results/$LATEST/summary.md"
                    if [[ -f "$SF" ]]; then
                      cat "$SF"
                    else
                      echo "(no summary in $LATEST)"
                      ls -la "test/results/$LATEST/" 2>/dev/null || true
                    fi
                  else
                    echo "(no test results directory found)"
                  fi

    # ── org 专用 e2e（阻塞：smoke 部分）──
    # org 的 25 条 smoke 做真实多进程编排（派发/认领/交付/验收/抢占/自愈），6 条 TUI 用例
    # 在 CI Linux 上卡在 pi-tui 的**终端颜色查询**（`]10;?` `]11;?` `]4;N;?` 发出后无应答，
    # 画面停在 alt-screen 空屏、120s 等待超时；同 code 本机全绿，见 e2e-org-tui 的 TODO）。
    # 故按 permission-gate 的既有先例拆分：smoke 阻塞、TUI 走非阻塞 job 保留信号。
    e2e-org:
        name: E2E org (smoke)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run org smoke e2e
              env:
                  E2E_POOL_SIZE: 2
                  E2E_BUDGET_STRICT: '1'
                  E2E_ENV_SENTINEL: 'strict'
              run: bash test/e2e/scripts/run-e2e.sh --ext org --smoke-only
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results-org
                  path: test/results/

    # ── org TUI e2e（非阻塞，已知间歇红）──
    # **已排除**：不是 pi-tui 终端查询、不是 org 代码。2026-10-28 在 CI 上打点实证——
    # `/org` 命令确实进入 tui 分支、`resolveSelf` 正常、看板组件被创建（H1→H2→H3→H5a/b/c
    # 全通过、无异常），但首帧渲染迟迟不落地 → wait_for 超时。
    # **现状**：同一份代码在不同 run 之间 0~6 条失败（8/8 全绿与 6/8 红都出现过），
    # 与并发/超时/预算/fd-rg 预装、以及「smoke 与 TUI 是否同 job」都不相关。
    # 判定为 2 核 runner 上「每条用例都起真实 pi + 真实 tmux」的边界负载问题。
    # 保留非阻塞以不丢趋势信号；结构性修法（把 8 条 TUI 合并成更少的 pi 启动，或改用 tmux
    # 中介终端）需要单独改造，完成后改回阻塞。
    e2e-org-tui:
        name: E2E org TUI (non-blocking)
        runs-on: ubuntu-latest
        continue-on-error: true
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run org TUI e2e
              env:
                  E2E_POOL_SIZE: 2
                  E2E_BUDGET_STRICT: '0'
              run: bash test/e2e/scripts/run-e2e.sh --ext org --tui
            - name: Warn on org TUI known flake
              if: always()
              run: |
                  echo "::warning::org TUI 在 2 核 CI 上间歇红（0~6/8），已排除代码与 pi-tui 因素，见 job 注释"
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results-org-tui
                  path: test/results/

    # ── permission-gate smoke e2e（阻塞）──
    # CI 主矩阵用 `--exclude worktree,permission-gate` 跳过它（TUI expect 在
    # Linux 崩溃，TODO P0）；这里用 `--smoke-only` 单跑它的 smoke.test.sh
    # （print 模式，非崩溃路径），把该模块的主要自动化断言恢复为**阻塞**门禁。
    e2e-permission-gate-smoke:
        name: E2E permission-gate (smoke)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run permission-gate smoke e2e
              env:
                  E2E_BUDGET_STRICT: '1'
                  E2E_ENV_SENTINEL: 'strict'
              run: |
                  bash test/e2e/scripts/run-e2e.sh \
                    --ext permission-gate --smoke-only
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-permission-gate-smoke
                  path: test/results/

    # ── Worktree E2E Tests (blocking) ──
    # 独立 job：worktree 扩展的测试作为 required status check 阻断合并
    e2e-worktree:
        name: E2E Worktree
        runs-on: ubuntu-latest
        continue-on-error: false
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run Vitest worktree tests
              run: |
                  npx vitest run test/vitest/extensions/worktree*.test.ts
            - name: Run bash e2e worktree tests
              env:
                  E2E_BUDGET_STRICT: '1'
                  E2E_ENV_SENTINEL: 'strict'
              run: bash test/e2e/scripts/run-e2e.sh --ext worktree

    # ── 离线包工具链 e2e（阻塞）──
    # AGENTS.md 的强制规则「改 scripts/offline* 后必须先跑通 e2e」此前零自动化保护：
    # `@zenone/pi-state` 缺失、探针 jiti 别名缺失这类「目标机丢掉整个安全栈」的缺陷
    # 只靠人肉跑 e2e 才发现（静态检查全绿）。离线目标机没有回滚通道，坏包只能重送介质。
    offline-e2e:
        name: Offline bundle e2e
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            # pack 要求 $PI_RUNTIME_DIR 是 releases/<版本> 布局（源机由 pi update 生成）。
            # 用 --prefix 装到临时目录即可复刻同一布局（hoisted node_modules）。
            - name: Prepare pi runtime
              run: |
                  set -euo pipefail
                  PI_VERSION="$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")"
                  mkdir -p "$RUNNER_TEMP/pi-runtime"
                  npm install --prefix "$RUNNER_TEMP/pi-runtime" --no-audit --no-fund \
                    "@earendil-works/pi-coding-agent@$PI_VERSION"
                  node scripts/offline/probe.mjs --preflight --runtime "$RUNNER_TEMP/pi-runtime"
            # 源机的 ~/.pi/agent 快照：ci runner 上没有，用最小形态合成。
            # node_modules 只放扩展里真正 import 的非 pi 裸模块（同目录下注释会说明代价）：
            # 少放一个 → 「探针：扩展加载失败 0 个」直接红，不会静默。
            - name: Prepare agent dir
              run: |
                  set -euo pipefail
                  AGENT="$RUNNER_TEMP/pi-agent"
                  mkdir -p "$AGENT"/node_modules "$AGENT"/npm/node_modules "$AGENT"/git \
                    "$AGENT"/extensions-data "$AGENT"/skills "$AGENT"/themes "$AGENT"/prompts
                  printf '{"editorPaddingX":1}\n' >"$AGENT/settings.json"
                  for spec in typebox diff @anthropic-ai/sandbox-runtime; do
                    mkdir -p "$AGENT/node_modules/$(dirname "$spec")"
                    ln -sfn "$PWD/node_modules/$spec" "$AGENT/node_modules/$spec"
                  done
            - name: Run offline bundle e2e
              env:
                  PI_OFFLINE_E2E_WORK: ${{ runner.temp }}/e2e-work
                  PI_AGENT_DIR: ${{ runner.temp }}/pi-agent
                  PI_RUNTIME_DIR: ${{ runner.temp }}/pi-runtime
              run: bash scripts/offline/e2e.sh
            - name: Upload e2e logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: offline-e2e-logs
                  path: ${{ runner.temp }}/e2e-work/*.log
                  if-no-files-found: ignore
