name: CI

on:
    push:
        branches: [main, master, dev]
    pull_request:
        branches: [main, master, dev]

env:
    # 统一 node 版本
    NODE_VERSION: '22'
    CI: true

# ── 通用步骤宏 ──
# 由于 GitHub Actions 不支持 YAML 锚点在 steps 中使用，
# 下面通过 setup-node + 公共依赖安装步骤在各 job 中展开

jobs:
    # ── Formatting ──
    format:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check formatting
              run: npm run format:check

    # ── Type checking ──
    typecheck:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: TypeScript check
              run: npm run typecheck
            - name: TypeScript check (smart-context)
              run: |
                  cd extensions/context/smart-context
                  npx tsc --noEmit

    # ── ci-watch 独立类型检查（根 tsconfig exclude 该扩展，需独立 job）──
    # ci-watch 是带自己 tsconfig 的独立包；此前其类型错误只能在 e2e 的 dist
    # 构建时（间接、分钟级）暴露，这里提供秒级快速门禁。
    ci-watch-typecheck:
        name: ci-watch TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: ci-watch type check
              run: cd extensions/verification/ci-watch && npx tsc --noEmit

    # ── Linting ──
    lint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: ESLint check
              run: npm run lint

    # ── TUI 合规门禁（ADR-0023，阻塞）──
    tui-compliance:
        name: TUI Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check TUI compliance (blocking)
              run: npm run lint:tui

    # ── Config 合规门禁（pi-config 标准化，WARN 不阻塞）──
    config-compliance:
        name: Config Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Check config compliance (warning, non-blocking)
              run: npm run lint:config

    # ── SAST ──
    semgrep:
        name: Semgrep
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep:latest
        steps:
            - uses: actions/checkout@v4
            - name: Semgrep ERROR (blocks merge)
              run: |
                  semgrep --config .semgrep.yml \
                    --exclude 'node_modules/**' \
                    --exclude '.pi/**' \
                    --exclude '.git/**' \
                    --metrics=off \
                    --no-git-ignore \
                    --error \
                    --severity ERROR
            - name: Semgrep WARNING (report only)
              if: always()
              run: |
                  semgrep --config .semgrep.yml \
                    --exclude 'node_modules/**' \
                    --exclude '.pi/**' \
                    --exclude '.git/**' \
                    --metrics=off \
                    --no-git-ignore \
                    --severity WARNING

    # ── Unit Tests（Vitest，阻塞）──
    unit-tests:
        name: Vitest
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run Vitest tests
              run: npm test

    # ── Bench Unit（analyze.py 统计口径，阻塞）──
    bench-unit:
        name: Bench Analyze Unit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Run analyze.py unit tests
              run: python3 bench/test_analyze.py

    # ── Bench Smoke（verify.sh 失败侧判定 + 骨架，阻塞，mock-llm 不烧钱）──
    bench-smoke:
        name: Bench Smoke
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25.2'
            - run: npm ci
            - name: Setup CI environment (installs pi)
              run: bash scripts/setup-ci.sh
            - name: Run bench smoke (scc, mock-llm)
              run: bash bench/smoke-test.sh --task scc-bounded-memory-spilling

    # ── E2E Tests（bash 集成测试，阻塞）──
    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run bash e2e tests (auto-pool)
              env:
                  E2E_POOL_SIZE: 4
              run: bash test/e2e/scripts/run-e2e.sh
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results
                  path: test/results/
            - name: Show summary
              if: always()
              run: |
                  LATEST=$(ls -1t test/results/ 2>/dev/null | head -1)
                  if [[ -n "$LATEST" ]]; then
                    SF="test/results/$LATEST/summary.md"
                    if [[ -f "$SF" ]]; then
                      cat "$SF"
                    else
                      echo "(no summary in $LATEST)"
                      ls -la "test/results/$LATEST/" 2>/dev/null || true
                    fi
                  else
                    echo "(no test results directory found)"
                  fi

    # ── Worktree E2E Tests (blocking) ──
    # 独立 job：worktree 扩展的测试作为 required status check 阻断合并
    e2e-worktree:
        name: E2E Worktree
        runs-on: ubuntu-latest
        continue-on-error: false
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install project dependencies
              run: npm ci
            - name: Setup CI environment
              run: bash scripts/setup-ci.sh
            - name: Run Vitest worktree tests
              run: |
                  npx vitest run \
                    test/vitest/extensions/worktree.test.ts \
                    test/vitest/extensions/worktree.operations.test.ts
            - name: Run bash e2e worktree tests
              run: bash test/e2e/scripts/run-e2e.sh --ext worktree
